name: Production read-only smoke

on:
  schedule:
    # UTC 00/06/12/18:17 = Beijing 08/14/20/02:17. Scheduler timing is best effort.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readonly-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    # Manual validation works before enablement; scheduled runs default to disabled.
    if: github.event_name == 'workflow_dispatch' || vars.FINDUEVAL_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check independent credential before installation or network probes
        env:
          FINDUEVAL_HEALTHCHECK_DATABASE_URL: ${{ secrets.FINDUEVAL_HEALTHCHECK_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          if not os.environ.get("FINDUEVAL_HEALTHCHECK_DATABASE_URL", "").strip():
              print("::error::CONFIGURATION FAILURE: missing FINDUEVAL_HEALTHCHECK_DATABASE_URL", file=sys.stderr)
              sys.exit(2)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Install independent probe dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-smoke.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Read database and public saved case
        env:
          FINDUEVAL_HEALTHCHECK_DATABASE_URL: ${{ secrets.FINDUEVAL_HEALTHCHECK_DATABASE_URL }}
        run: python scripts/production_smoke.py
      - name: Save public failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-smoke-public-failure
          path: artifacts/production-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7
